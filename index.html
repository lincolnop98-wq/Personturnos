/* ---------- helpers ---------- */
const eur = v => new Intl.NumberFormat("pt-PT", {
  style: "currency",
  currency: "EUR"
}).format(v || 0);
const eur0 = v => new Intl.NumberFormat("pt-PT", {
  style: "currency",
  currency: "EUR"
}).format(v || 0);
const isoLocal = d => {
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, "0");
  const dd = String(d.getDate()).padStart(2, "0");
  return `${y}-${m}-${dd}`;
};
const hojeISO = () => isoLocal(new Date());
const uid = () => `${Date.now()}-${Math.random().toString(36).slice(2, 7)}`;
function fmtData(iso) {
  const [y, m, d] = iso.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  return `${DIAS_SEMANA[dt.getDay()]}, ${d} ${MESES_CURTO[m - 1]}`;
}
function catDe(cats, id) {
  return cats.find(c => c.id === id) || {
    id,
    nome: "—",
    cor: C.dim,
    emoji: "•"
  };
}
// meses entre dois "yyyy-mm"
function salarioDoMes(salarios, ano, mes) {
  return salarios.find(s => s.ano === ano && s.mes === mes) || null;
}
function previsaoDoMes(previsoes, ano, mes) {
  return previsoes.find(p => p.ano === ano && p.mes === mes) || null;
}
function mesesEntre(desde, ano, mes) {
  const [y, m] = desde.split("-").map(Number);
  return (ano - y) * 12 + (mes - (m - 1) - 1) + 1; // índice 0-based do mês atual
}

/* ============================================================
   APP
   ============================================================ */
function Prumo() {
  const [cfg, setCfg] = useState({
    salarioConta: 0,
    salarioCartao: 0,
    diaSalario: 1,
    objetivo: 0,
    acento: "violeta"
  });
  const [cats, setCats] = useState(CATS_DEFAULT);
  const [gastos, setGastos] = useState([]); // {id,data,valor,categoria,metodo,nota}
  const [fixas, setFixas] = useState([]); // {id,nome,valor,dia,categoria}
  const [prestacoes, setPrestacoes] = useState([]); // {id,nome,valor,dia,meses,desde,categoria}
  const [dividas, setDividas] = useState([]); // {id,nome,valorTotal,categoria,criada,concluida,pagamentos:[{id,data,valor}]}
  const [pagamentosFixas, setPagamentosFixas] = useState([]); // {id,itemId,prefixo} — marca que uma conta fixa/prestação foi paga nesse mês
  const [poupanca, setPoupanca] = useState([]); // {id,data,valor}  (valor>0 guardar, <0 retirar)
  const [extras, setExtras] = useState([]); // {id,data,valor,nota} entradas extra
  const [salarios, setSalarios] = useState([]); // {id,ano,mes,conta,cartao} — salário varia por mês (horas)
  const [previsoes, setPrevisoes] = useState([]); // {id,ano,mes,valor,nota} — estimativa de quanto vais receber num mês futuro, antes de confirmado
  const [carregado, setCarregado] = useState(false);
  const hoje = new Date();
  const [mesRef, setMesRef] = useState({
    ano: hoje.getFullYear(),
    mes: hoje.getMonth()
  });
  const [aba, setAba] = useState("mes");

  /* carregar */
  useEffect(() => {
    (async () => {
      try {
        const r = await window.storage.get(STORAGE_KEY);
        if (r?.value) {
          const d = JSON.parse(r.value);
          if (d.cfg) setCfg(p => ({
            ...p,
            ...d.cfg
          }));
          if (Array.isArray(d.cats) && d.cats.length) setCats(d.cats);
          if (Array.isArray(d.gastos)) setGastos(d.gastos);
          if (Array.isArray(d.fixas)) setFixas(d.fixas);
          if (Array.isArray(d.prestacoes)) setPrestacoes(d.prestacoes);
          if (Array.isArray(d.dividas)) setDividas(d.dividas);
          if (Array.isArray(d.pagamentosFixas)) setPagamentosFixas(d.pagamentosFixas);
          if (Array.isArray(d.poupanca)) setPoupanca(d.poupanca);
          if (Array.isArray(d.extras)) setExtras(d.extras);
          if (Array.isArray(d.salarios)) setSalarios(d.salarios);
          if (Array.isArray(d.previsoes)) setPrevisoes(d.previsoes);
        }
      } catch (e) {}
      setCarregado(true);
    })();
  }, []);

  /* guardar */
  useEffect(() => {
    if (!carregado) return;
    window.storage.set(STORAGE_KEY, JSON.stringify({
      cfg,
      cats,
      gastos,
      fixas,
      prestacoes,
      dividas,
      poupanca,
      extras,
      salarios,
      previsoes,
      pagamentosFixas
    })).catch(() => {});
  }, [cfg, cats, gastos, fixas, prestacoes, dividas, poupanca, extras, salarios, previsoes, pagamentosFixas, carregado]);

  /* ---------- derivados do mês em foco ---------- */
  const dados = useMemo(() => {
    const {
      ano,
      mes
    } = mesRef;
    const prefixo = `${ano}-${String(mes + 1).padStart(2, "0")}`;
    const nDias = new Date(ano, mes + 1, 0).getDate();
    const estaPago = itemId => pagamentosFixas.some(pg => pg.itemId === itemId && pg.prefixo === prefixo);
    const gastosMes = gastos.filter(g => g.data.startsWith(prefixo));
    // só conta para o dinheiro real (conta/dinheiro) — o cartão refeição é seguido à parte, não é dinheiro que dá para juntar
    const totalGastos = gastosMes.filter(g => g.metodo !== "cartao").reduce((a, g) => a + (g.valor || 0), 0);
    // contas fixas só descontam do saldo quando marcadas como PAGAS — antes disso é só um compromisso, não contabiliza
    const totalFixas = fixas.filter(f => estaPago(f.id)).reduce((a, f) => a + (f.valor || 0), 0);
    const prestacoesMes = prestacoes.filter(p => {
      const idx = mesesEntre(p.desde, ano, mes);
      return idx >= 0 && idx < p.meses;
    });
    const totalPrestacoes = prestacoesMes.filter(p => estaPago(p.id)).reduce((a, p) => a + (p.valor || 0), 0);

    // dívidas: valor livre, o que importa é o que foi PAGO este mês (pagamentos marcados manualmente)
    const pagamentosDividasMes = [];
    for (const dv of dividas) {
      for (const pg of dv.pagamentos || []) {
        if (pg.data.startsWith(prefixo)) pagamentosDividasMes.push({
          ...pg,
          dividaId: dv.id,
          nome: dv.nome,
          categoria: dv.categoria
        });
      }
    }
    const totalDividas = pagamentosDividasMes.reduce((a, pg) => a + (pg.valor || 0), 0);
    const dividasResumo = dividas.map(dv => {
      const pago = (dv.pagamentos || []).reduce((a, pg) => a + (pg.valor || 0), 0);
      const pagoMes = (dv.pagamentos || []).filter(pg => pg.data.startsWith(prefixo)).reduce((a, pg) => a + (pg.valor || 0), 0);
      return {
        ...dv,
        pago,
        pagoMes,
        restante: Math.max(0, dv.valorTotal - pago)
      };
    });
    const totalDividasRestante = dividasResumo.filter(dv => !dv.concluida).reduce((a, dv) => a + dv.restante, 0);
    const extrasMes = extras.filter(e => e.data.startsWith(prefixo)).reduce((a, e) => a + (e.valor || 0), 0);
    const salarioMes = salarioDoMes(salarios, ano, mes);
    const salConta = salarioMes ? salarioMes.conta || 0 : 0;
    const salCartao = salarioMes ? salarioMes.cartao || 0 : 0;
    // entradas reais (dinheiro que dá para juntar) — o cartão refeição fica de fora, é seguido à parte
    const entradas = salConta + extrasMes;
    const saiu = totalGastos + totalFixas + totalPrestacoes + totalDividas;
    const sobrou = entradas - saiu;
    const guardadoMes = poupanca.filter(p => p.data.startsWith(prefixo)).reduce((a, p) => a + (p.valor || 0), 0);
    const poupancaTotal = poupanca.reduce((a, p) => a + (p.valor || 0), 0);

    // cartão refeição restante (gastos do mês pagos com cartão)
    const gastoCartao = gastosMes.filter(g => g.metodo === "cartao").reduce((a, g) => a + g.valor, 0);
    const cartaoRestante = salCartao - gastoCartao;

    // por categoria (gastos + fixas + prestações) para o donut
    const porCat = {};
    const porCatItens = {};
    const addCatItem = (catId, item) => {
      (porCatItens[catId] = porCatItens[catId] || []).push(item);
    };
    for (const g of gastosMes) {
      porCat[g.categoria] = (porCat[g.categoria] || 0) + g.valor;
      addCatItem(g.categoria, {
        data: g.data,
        nome: g.nota || null,
        valor: g.valor,
        metodo: g.metodo,
        pessoa: g.pessoa,
        tipo: "gasto"
      });
    }
    for (const f of fixas.filter(f => estaPago(f.id))) {
      porCat[f.categoria || "casa"] = (porCat[f.categoria || "casa"] || 0) + f.valor;
      addCatItem(f.categoria || "casa", {
        dia: f.dia,
        nome: f.nome,
        valor: f.valor,
        tipo: "fixa"
      });
    }
    for (const p of prestacoesMes.filter(p => estaPago(p.id))) {
      porCat[p.categoria || "outros"] = (porCat[p.categoria || "outros"] || 0) + p.valor;
      addCatItem(p.categoria || "outros", {
        dia: p.dia,
        nome: p.nome,
        valor: p.valor,
        tipo: "prestacao"
      });
    }
    for (const pg of pagamentosDividasMes) {
      porCat[pg.categoria || "outros"] = (porCat[pg.categoria || "outros"] || 0) + pg.valor;
      addCatItem(pg.categoria || "outros", {
        data: pg.data,
        nome: pg.nome,
        valor: pg.valor,
        tipo: "divida"
      });
    }
    const catList = Object.entries(porCat).map(([id, v]) => ({
      ...catDe(cats, id),
      valor: v,
      itens: (porCatItens[id] || []).sort((a, b) => {
        if (a.data && b.data) return a.data < b.data ? 1 : -1;
        if (a.data && !b.data) return -1;
        if (!a.data && b.data) return 1;
        return (a.dia || 0) - (b.dia || 0);
      })
    })).sort((a, b) => b.valor - a.valor);

    // saúde financeira: compara o gasto de cada categoria com uma fatia saudável do salário real (conta)
    const saudeCategorias = catList.map(c => {
      const limitePct = limiteDe(cfg, c.id);
      const limiteEuros = limitePct !== null && salConta > 0 ? salConta * limitePct / 100 : null;
      const pctGasto = salConta > 0 ? c.valor / salConta * 100 : null;
      let estado = "sem-regra";
      if (limitePct !== null && salConta > 0) {
        if (c.valor <= limiteEuros * 0.8) estado = "ok";else if (c.valor <= limiteEuros) estado = "atencao";else estado = "excedido";
      }
      return {
        ...c,
        limitePct,
        limiteEuros,
        pctGasto,
        estado
      };
    });

    // curva de saldo ao longo do mês (entradas no dia 1, saídas nos dias)
    const porDiaSaida = {};
    for (const g of gastosMes) {
      if (g.metodo === "cartao") continue; // não sai do saldo real
      const d = Number(g.data.slice(8, 10));
      porDiaSaida[d] = (porDiaSaida[d] || 0) + g.valor;
    }
    for (const f of fixas.filter(f => estaPago(f.id))) porDiaSaida[f.dia] = (porDiaSaida[f.dia] || 0) + f.valor;
    for (const p of prestacoesMes.filter(p => estaPago(p.id))) porDiaSaida[p.dia] = (porDiaSaida[p.dia] || 0) + p.valor;
    for (const pg of pagamentosDividasMes) {
      const d = Number(pg.data.slice(8, 10));
      porDiaSaida[d] = (porDiaSaida[d] || 0) + pg.valor;
    }
    let saldo = entradas;
    const curva = [];
    for (let d = 1; d <= nDias; d++) {
      saldo -= porDiaSaida[d] || 0;
      curva.push(saldo);
    }

    // "a pagar" e "hoje" (fixas/prestações ainda por marcar como pagas não temos flag → mostramos as do mês)
    const hojeD = new Date();
    const ehMesAtual = hojeD.getFullYear() === ano && hojeD.getMonth() === mes;
    const diaHoje = hojeD.getDate();
    const aPagar = [];
    for (const f of fixas) aPagar.push({
      id: f.id,
      nome: f.nome,
      valor: f.valor,
      dia: f.dia,
      cat: f.categoria,
      icone: catDe(cats, f.categoria).icone,
      pago: estaPago(f.id)
    });
    for (const p of prestacoesMes) aPagar.push({
      id: p.id,
      nome: p.nome,
      valor: p.valor,
      dia: p.dia,
      cat: p.categoria,
      icone: catDe(cats, p.categoria).icone,
      prest: true,
      resta: p.meses - mesesEntre(p.desde, ano, mes),
      pago: estaPago(p.id)
    });
    aPagar.sort((a, b) => a.dia - b.dia);
    const contasPrioritariasOk = fixas.length > 0 && fixas.every(f => estaPago(f.id));
    return {
      prefixo,
      nDias,
      gastosMes,
      totalGastos,
      totalFixas,
      totalPrestacoes,
      prestacoesMes,
      entradas,
      saiu,
      sobrou,
      guardadoMes,
      poupancaTotal,
      cartaoRestante,
      catList,
      curva,
      aPagar,
      ehMesAtual,
      diaHoje,
      extrasMes,
      extrasList: extras.filter(e => e.data.startsWith(prefixo)).sort((a, b) => a.data < b.data ? 1 : -1),
      salarioMes: salarioMes ? {
        conta: salConta,
        cartao: salCartao
      } : null,
      totalDividas,
      totalDividasRestante,
      dividasResumo,
      saudeCategorias,
      contasPrioritariasOk,
      salConta
    };
  }, [mesRef, gastos, fixas, prestacoes, dividas, poupanca, extras, salarios, pagamentosFixas, cfg, cats]);

  /* mapa dia(número) → lista de itens (gasto/fixa/prestação) para o calendário */
  const porDia = useMemo(() => {
    const {
      prefixo,
      prestacoesMes
    } = dados;
    const m = {};
    for (const g of gastos.filter(x => x.data.startsWith(prefixo))) {
      const d = Number(g.data.slice(8, 10));
      (m[d] = m[d] || []).push({
        tipo: "gasto",
        valor: g.valor,
        cor: catDe(cats, g.categoria).cor,
        icone: catDe(cats, g.categoria).icone,
        nome: catDe(cats, g.categoria).nome,
        id: g.id,
        ...g
      });
    }
    for (const f of fixas) {
      (m[f.dia] = m[f.dia] || []).push({
        tipo: "fixa",
        cat: f.categoria,
        valor: f.valor,
        cor: catDe(cats, f.categoria).cor,
        icone: catDe(cats, f.categoria).icone,
        nome: f.nome
      });
    }
    for (const p of prestacoesMes) {
      (m[p.dia] = m[p.dia] || []).push({
        tipo: "prestacao",
        cat: p.categoria,
        valor: p.valor,
        cor: catDe(cats, p.categoria).cor,
        icone: catDe(cats, p.categoria).icone,
        nome: p.nome
      });
    }
    return m;
  }, [dados, gastos, fixas, cats]);
  const pessoasExistentes = useMemo(() => Array.from(new Set(gastos.map(g => g.pessoa).filter(Boolean))).sort((a, b) => a.localeCompare(b, "pt")), [gastos]);
  const analiseAno = useMemo(() => {
    const ano = mesRef.ano;
    const meses = [];
    for (let m = 0; m < 12; m++) {
      const pref = `${ano}-${String(m + 1).padStart(2, "0")}`;
      const g = gastos.filter(x => x.data.startsWith(pref)).reduce((a, x) => a + x.valor, 0);
      const fx = fixas.reduce((a, f) => a + f.valor, 0);
      const pr = prestacoes.filter(p => {
        const i = mesesEntre(p.desde, ano, m);
        return i >= 0 && i < p.meses;
      }).reduce((a, p) => a + p.valor, 0);
      const gd = poupanca.filter(x => x.data.startsWith(pref)).reduce((a, x) => a + x.valor, 0);
      meses.push({
        m,
        gastos: g,
        fixas: fx,
        prest: pr,
        saiu: g + fx + pr,
        guardado: gd
      });
    }
    const porCat = {};
    const mset = new Set();
    for (const x of gastos) {
      if (!x.data.startsWith(ano + "-")) continue;
      mset.add(x.data.slice(0, 7));
      if (!porCat[x.categoria]) porCat[x.categoria] = {
        total: 0,
        meses: Array(12).fill(0),
        itens: []
      };
      const pc = porCat[x.categoria];
      pc.total += x.valor;
      pc.meses[Number(x.data.slice(5, 7)) - 1] += x.valor;
      pc.itens.push({
        id: x.id,
        data: x.data,
        valor: x.valor,
        metodo: x.metodo,
        nota: x.nota,
        pessoa: x.pessoa
      });
    }
    const nm = Math.max(1, mset.size);
    const medias = Object.entries(porCat).map(([id, pc]) => ({
      ...catDe(cats, id),
      total: pc.total,
      media: pc.total / nm,
      meses: pc.meses,
      itens: pc.itens.sort((a, b) => a.data < b.data ? 1 : -1)
    })).sort((a, b) => b.total - a.total);
    let acc = 0;
    const poupCum = meses.map(mm => {
      acc += mm.guardado;
      return acc;
    });
    const porPessoa = {};
    for (const x of gastos) {
      if (!x.pessoa || !x.data.startsWith(ano + "-")) continue;
      if (!porPessoa[x.pessoa]) porPessoa[x.pessoa] = {
        nome: x.pessoa,
        total: 0,
        porCat: {},
        porMetodo: {},
        meses: Array(12).fill(0),
        itens: []
      };
      const pp = porPessoa[x.pessoa];
      pp.total += x.valor;
      pp.porCat[x.categoria] = (pp.porCat[x.categoria] || 0) + x.valor;
      pp.porMetodo[x.metodo] = (pp.porMetodo[x.metodo] || 0) + x.valor;
      pp.meses[Number(x.data.slice(5, 7)) - 1] += x.valor;
      pp.itens.push({
        id: x.id,
        data: x.data,
        valor: x.valor,
        categoria: x.categoria,
        metodo: x.metodo,
        nota: x.nota
      });
    }
    const pessoas = Object.values(porPessoa).map(pp => ({
      ...pp,
      porCatList: Object.entries(pp.porCat).map(([id, v]) => ({
        ...catDe(cats, id),
        valor: v
      })).sort((a, b) => b.valor - a.valor),
      itens: pp.itens.map(it => ({
        ...it,
        cat: catDe(cats, it.categoria)
      })).sort((a, b) => a.data < b.data ? 1 : -1)
    })).sort((a, b) => b.total - a.total);
    return {
      ano,
      meses,
      medias,
      poupCum,
      nm,
      pessoas
    };
